name: CI
on:
  push:
    branches: [dev, "feature/**", "feat/frontend-connect"]
  pull_request:
    branches: [dev, main, "feat/frontend-connect"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: ./mvnw --batch-mode verify

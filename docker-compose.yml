services:
  postgres:
    image: postgres:16
    container_name: cityguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cityguide
      POSTGRES_USER: cityguide
      POSTGRES_PASSWORD: cityguide
    ports:
      - "5432:5432"
    volumes:
      - cityguide-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cityguide -d cityguide"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cityguide-postgres-data:

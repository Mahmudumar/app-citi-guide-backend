spring:
  application:
    name: cityguide-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cityguide}
    username: ${DB_USER:cityguide}
    password: ${DB_PASSWORD:cityguide}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
server:
  # Render supplies PORT; local development continues to use SERVER_PORT.
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lock-seconds: ${LOGIN_LOCK_SECONDS:60}
  reset:
    code-ttl-minutes: ${RESET_CODE_TTL_MINUTES:10}
    max-attempts: ${RESET_MAX_ATTEMPTS:5}
  cors:
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
  mail:
    from: ${MAIL_FROM:}
  dev:
    return-reset-code: ${DEV_RETURN_RESET_CODE:false}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

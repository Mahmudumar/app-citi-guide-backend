spring.application.name=app-citi-guide-backend

# Supabase PostgreSQL JDBC connection. Never hardcode credentials here.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.pool-name=AppCitiGuideHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Do not let Hibernate create or change Supabase tables automatically.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Basic health endpoint only; do not expose configuration or environment details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=${PORT:8080}
